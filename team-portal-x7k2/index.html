<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Portal — UniversityJano</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="{{ '/images/logo.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/design-system.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/components.css' | relative_url }}">
<style>
  body{background:#f1f5f9;min-height:100vh;}
  .gate-wrap{max-width:380px;margin:8vh auto;background:#fff;border-radius:14px;padding:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
  .gate-wrap h1{font-size:1.3rem;color:#0b1b3d;margin-bottom:0.25rem;}
  .gate-wrap p{color:#64748b;font-size:0.9rem;margin-bottom:1.5rem;}
  .gate-wrap input{width:100%;padding:0.7rem 0.9rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:0.85rem;font-size:0.95rem;box-sizing:border-box;}
  .gate-wrap button{width:100%;padding:0.75rem;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:0.95rem;cursor:pointer;}
  .gate-error{color:#dc2626;font-size:0.85rem;margin-top:0.5rem;display:none;}
  .dash-wrap{max-width:1100px;margin:2rem auto;padding:0 1.25rem;display:none;}
  .dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem;}
  .dash-top h1{color:#0b1b3d;font-size:1.4rem;}
  .dash-top button{background:#fff;border:1px solid #cbd5e1;padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.85rem;}
  .lead-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;border-collapse:collapse;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
  .lead-table th{background:#0b1b3d;color:#fff;text-align:left;padding:0.7rem 0.9rem;font-size:0.8rem;}
  .lead-table td{padding:0.7rem 0.9rem;border-bottom:1px solid #e2e8f0;font-size:0.85rem;color:#334155;}
  .badge{display:inline-block;padding:0.15rem 0.6rem;border-radius:999px;font-size:0.75rem;font-weight:600;}
  .badge-new{background:#fee2e2;color:#b91c1c;}
  .badge-contacted{background:#fef3c7;color:#92400e;}
  .badge-counselled{background:#dcfce7;color:#166534;}
  .empty-note{background:#fff;border-radius:12px;padding:2rem;text-align:center;color:#64748b;}
</style>
</head>
<body>

<div class="gate-wrap" id="gateWrap">
  <h1>🔒 Team Portal Login</h1>
  <p>Authorized UniversityJano team members only.</p>
  <input type="text" id="loginUser" placeholder="Username" autocomplete="off">
  <input type="password" id="loginPass" placeholder="Password" autocomplete="off">
  <button onclick="tryLogin()">Log In</button>
  <div class="gate-error" id="gateError">Incorrect username or password.</div>
</div>

<div class="dash-wrap" id="dashWrap">
  <div class="dash-top">
    <h1>📊 Leads CRM</h1>
    <div>
      <span id="loggedInAs" style="margin-right:1rem;color:#64748b;font-size:0.85rem;"></span>
      <button onclick="exportCsv()">⬇ Export CSV</button>
      <button onclick="logout()">Log Out</button>
    </div>
  </div>
  <div id="leadsContainer"></div>
</div>

<script>
  // ---- Team member accounts ----
  // IMPORTANT: this is a basic access gate, not bank-level security — anyone
  // who views this page's source code could technically find these
  // credentials. It stops casual visitors and keeps this page out of Google,
  // but for real security, move to a proper backend + database later.
  // To add/remove a team member, just edit this list and re-upload the file.
  var TEAM_ACCOUNTS = [
    { user: "ankit", pass: "CHANGE_THIS_PASSWORD_1" },
    { user: "team2", pass: "CHANGE_THIS_PASSWORD_2" }
  ];

  function tryLogin() {
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    var match = TEAM_ACCOUNTS.find(function(a) { return a.user === u && a.pass === p; });
    if (match) {
      sessionStorage.setItem('uj_team_portal_user', u);
      showDashboard(u);
    } else {
      document.getElementById('gateError').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('uj_team_portal_user');
    document.getElementById('dashWrap').style.display = 'none';
    document.getElementById('gateWrap').style.display = 'block';
  }

  function showDashboard(username) {
    document.getElementById('gateWrap').style.display = 'none';
    document.getElementById('dashWrap').style.display = 'block';
    document.getElementById('loggedInAs').textContent = 'Logged in as ' + username;
    renderLeads();
  }

  function getLeads() {
    try {
      var data = localStorage.getItem('uj_captured_leads_v1');
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function statusBadge(status) {
    var cls = 'badge-new';
    if (status === 'Contacted') cls = 'badge-contacted';
    if (status === 'Counselled') cls = 'badge-counselled';
    return '<span class="badge ' + cls + '">' + status + '</span>';
  }

  function renderLeads() {
    var leads = getLeads();
    var container = document.getElementById('leadsContainer');
    if (!leads.length) {
      container.innerHTML = '<div class="empty-note">No leads captured on this device/browser yet.<br><br>⚠️ Note: leads are currently only saved locally in each visitor\\'s own browser, not sent to a central database — talk to your developer about connecting the lead form to a real data store (like a Google Sheet) so all real visitor submissions reach this dashboard.</div>';
      return;
    }
    var html = '<table class="lead-table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Course</th><th>City</th><th>Source</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    leads.forEach(function(l) {
      html += '<tr><td>' + (l.name||'') + '</td><td>' + (l.phone||'') + '</td><td>' + (l.email||'') + '</td><td>' + (l.course||'') + '</td><td>' + (l.city||'') + '</td><td>' + (l.source||'') + '</td><td>' + statusBadge(l.status||'New Lead') + '</td><td>' + (l.createdAt ? new Date(l.createdAt).toLocaleDateString() : '') + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function exportCsv() {
    var leads = getLeads();
    if (!leads.length) { alert('No leads to export.'); return; }
    var headers = ['Name','Phone','Email','City','State','Course','Source','Status','Created At'];
    var rows = leads.map(function(l) {
      return [l.name,l.phone,l.email,l.city,l.state,l.course,l.source,l.status,l.createdAt].map(function(v){ return '"' + (v||'').toString().replace(/"/g,'""') + '"'; }).join(',');
    });
    var csv = headers.join(',') + '\\n' + rows.join('\\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'universityjano-leads.csv';
    link.click();
  }

  // Auto-login if already logged in this browser session
  (function() {
    var existing = sessionStorage.getItem('uj_team_portal_user');
    if (existing) showDashboard(existing);
  })();

  document.getElementById('loginPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });
</script>
</body>
</html>
