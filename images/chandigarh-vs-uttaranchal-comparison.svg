<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Chandigarh University Online vs Uttaranchal University Online</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#93c5fd">UniversityJano.com — 2026 Comparison</text>

  <!-- Chandigarh card -->
  <rect x="80" y="130" width="480" height="470" rx="18" fill="url(#cardA)"/>
  <text x="320" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Chandigarh University</text>
  <text x="320" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#fff7ed">Online (CU-IDOL)</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#ffffff">
    <text x="115" y="260">✓ NAAC A+ | NIRF #19-32</text>
    <text x="115" y="295">✓ UGC-DEB &amp; AICTE approved</text>
    <text x="115" y="330">✓ MBA total: ~₹1.26L – ₹1.98L</text>
    <text x="115" y="365">✓ Early-bird scholarship up to 25%</text>
    <text x="115" y="400">✓ 18+ online UG/PG programs</text>
    <text x="115" y="435">✓ Strong brand &amp; placement scale</text>
    <text x="115" y="470">✓ Reported top package: ₹52.1L</text>
    <text x="115" y="505">✓ Established 2012, Mohali, Punjab</text>
    <text x="115" y="540">✓ Larger alumni &amp; corporate network</text>
  </g>

  <!-- Uttaranchal card -->
  <rect x="640" y="130" width="480" height="470" rx="18" fill="url(#cardB)"/>
  <text x="880" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Uttaranchal University</text>
  <text x="880" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ecfdf5">Online</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#ffffff">
    <text x="675" y="260">✓ NAAC A+ (first cycle, Uttarakhand)</text>
    <text x="675" y="295">✓ UGC-DEB approved</text>
    <text x="675" y="330">✓ MBA total: ~₹1.2L | MCA: ~₹92K</text>
    <text x="675" y="365">✓ Early-bird scholarship up to 30%</text>
    <text x="675" y="400">✓ Free Infosys certification included</text>
    <text x="675" y="435">✓ EMI from ₹3,956/month</text>
    <text x="675" y="470">✓ 85%+ placement assistance rate</text>
    <text x="675" y="505">✓ Established 2012, Dehradun</text>
    <text x="675" y="540">✓ Lower entry cost overall</text>
  </g>

  <text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#93c5fd">Both are UGC-DEB approved &amp; NAAC A+ — always re-verify current fees on the official portal before enrolling</text>
</svg>
